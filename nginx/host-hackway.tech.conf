# Config do nginx DO HOST (VPS), nao do container.
# Instalar em /etc/nginx/sites-available/hackway.tech e linkar em sites-enabled.
# O certbot adiciona os blocos de SSL e o redirect 80 -> 443 automaticamente.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hackway.tech www.hackway.tech;

    client_max_body_size 10m;

    location / {
        # O compose publica o nginx interno em 127.0.0.1:8080.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }
}
